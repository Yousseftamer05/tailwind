<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style type="text/tailwindcss">
            @theme {
                --font-sans: "Poppins", sans-serif;
                --color-gray-text: #717171;
                --color-background: #FBFBFB;
                --color-secondary:#1B1B1B;
            }
        </style>
    </head>
    <body class="bg-background">
        <section class="contact-us py-20 ">
            <div class="container mx-auto">
               <div class="contact-us-header flex flex-col items-center gap-5 mb-32">
                <h2 class="text-3xl font-medium uppercase">Contact Us</h2>
                <p class="text-gray-text">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Similique, minima.</p>
               </div>
            <div class=" overflow-hidden relative contact-us-form h-[100vh] bg-white p-4 rounded-2xl shadow-[0_10px_25px_rgba(0,0,0,0.1)] flex gap-4">
                <div class="contact-us-form-banner text-white p-8 pt-10 flex flex-col justify-between h-full bg-black min-w-[40%] rounded-2xl relative overflow-hidden">
                    <img src="./image1.png" class="absolute bottom-0 right-0"/>
                    <div class="form-header">
                        <h3 class="text-2xl">Contact Information</h3>
                        <p class="text-gray-text mt-4">Say something to start a live chat!</p>
                    </div>
                    <div class="form-contact flex flex-col gap-16 relative z-1 w-3/4 ">
                        <div class="flex items-center gap-4">
                            <span>+1012 3456 789</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <span>demo@gmail.com</span>
                        </div>
                        <div class="flex items-center gap-4">
                            132 Dartmouth Street Boston, Massachusetts 02156 United States
                        </div>
                    </div>
                    <div class="form-social flex items-center gap-6">
                        <div class="media w-10 h-10 rounded-full bg-secondary hover:bg-white duration-300 cursor-pointer flex items-center justify-center">
                            <i class="fa-brands fa-twitter text-white flex items-center justify-center hover:text-black"></i>
                        </div>
                        <div class="media w-10 h-10 rounded-full bg-secondary hover:bg-white duration-300 hover:text-black cursor-pointer flex items-center justify-center ">
                            <i class="fa-brands fa-facebook text-white flex items-center justify-center hover:text-black"></i>
                        </div>
                        <div class="media w-10 h-10 rounded-full bg-secondary hover:bg-white duration-300 hover:text-black cursor-pointer flex items-center justify-center">
                            <i class="fa-brands fa-instagram text-white flex items-center justify-center hover:text-black"></i>
                        </div>
                    </div>
                </div>
                <div class="contact-us-form-inputs h-full flex-1 grid grid-cols-2 gap-5 p-10 mb-0">
                    <div class="contact-us-input-line flex flex-col col-span-1 mb-0">
                        <label for="FirstName">First Name</label>
                        <input type="text" id="firstName" class="border-b-[#8D8D8D] border-b-1">
                    </div>
                    <div class="contact-us-input-line flex flex-col col-span-1 mb-0">
                        <label for="LastName">Last Name</label>
                        <input type="text" id="LastName" class="border-b-[#8D8D8D] border-b-1">
                    </div>
                    <div class="contact-us-input-line flex flex-col col-span-1">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="border-b-[#8D8D8D] border-b-1">
                    </div>
                    <div class="contact-us-input-line flex flex-col col-span-1">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" class="border-b-[#8D8D8D] border-b-1">
                    </div>
                    <div class="contact-us-input-line flex flex-col col-span-2 ">
                        <label for="phone" class="font-bold">Select Subject?</label>
                        <div class="checkbox-choose flex justify-between ">
                        <input type="checkbox" id="generalInquiry1" name="generalInquiry">
                        <label for="generalInquiry1">general inquiry</label>
                        <input type="checkbox" id="generalInquiry2" name="generalInquiry">
                        <label for="generalInquiry2">general inquiry</label>
                        <input type="checkbox" id="generalInquiry3" name="generalInquiry">
                        <label for="generalInquiry3">general inquiry</label>
                        <input type="checkbox" id="generalInquiry4" name="generalInquiry">
                        <label for="generalInquiry4">general inquiry</label>
                        </div>
                        <label for="message" class="font-bold mt-5">Message</label>
                        <textarea name="message" id="message" cols="1" rows="1" class="border-b-[#8D8D8D] border-b-1"></textarea>
                        <div class="flex items-end justify-end  ">
                            <button class="bg-secondary text-white py-2 px-4 rounded-lg w-1/4 mt-5 hover:bg-black duration-300">Send Message</button>
                        </div>
                        <img src="./5e52eb20ee9158ca0835b430d0b6ef56e2d7385e.png" alt="" class=" w-80 h-40  absolute  -rotate-35 right-30 -bottom-10"/>
                    </div>
                    </div>
                    
                    
                </div>
               </div>
            </div>
           
        </section>
    </body>
</html>
